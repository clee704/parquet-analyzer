name: Release

# Publishes the package to PyPI via Trusted Publishing (OIDC) — no API
# token or password is stored in the repo or anywhere else; the publish
# job mints a short-lived OIDC token at runtime that PyPI verifies
# against the configured trusted publisher.
#
# Structure follows the PyPA-recommended pattern: an unprivileged `build`
# job produces the artifacts, and a separate `publish` job (its only
# elevated permission is `id-token: write`, with no checkout and no code
# execution beyond the publish action) uploads them — keeping the
# privileged surface minimal.
#
# Triggers:
#   - release: published — the normal path; builds the release's tag.
#   - workflow_dispatch  — manual, with an optional `ref` input so a tag
#     cut before this workflow existed (e.g. v0.6.0) can be built and
#     published. The workflow definition is always read from the default
#     branch; `ref` only controls what gets checked out and built.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to build & publish, e.g. v0.6.0"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0 # full history + tags so hatch-vcs can derive the version
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse to publish a non-tagged (development) version
        run: |
          if ! git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "::error::HEAD is not exactly on a tag, so hatch-vcs would produce a .dev/local version that PyPI rejects. Dispatch with a release tag via the 'ref' input (e.g. v0.6.0), or publish from a 'release: published' event."
            exit 1
          fi
          echo "building tagged version: $(git describe --exact-match --tags HEAD)"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parquet-analyzer
    permissions:
      id-token: write # mandatory for Trusted Publishing; no other scope needed
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
